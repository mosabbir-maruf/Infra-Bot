name: CI

run-name: "CI | ${{ github.ref_name }} @ ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default; no deploy here (Cloudflare Git integration auto-deploys).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_COLOR: 1

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript typecheck
        run: npm run build

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm run test

  worker-dry-run:
    name: Validate Worker (Wrangler dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate worker bundle (no deploy)
        # Validates bundling only — never deploys (CF Git integration owns deploys).
        run: npx wrangler deploy --dry-run

  ci:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, typecheck, test, worker-dry-run]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.worker-dry-run.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI checks passed."
